<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONTACT — KODY BOUSHER</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
</head>
<script src="script.js"></script>
<body class="inner-page">

    <div class="grid-overlay"></div>
    <div class="custom-cursor"></div>

    <header class="header">
        <nav class="nav">
            <a href="index.html#work" class="nav-link">HOME</a>
            <a href="work.html" class="nav-link">WORK</a>
            <a href="about.html" class="nav-link">ABOUT</a>
            <a href="contact.html" class="nav-link active">CONTACT</a>
        </nav>
    </header>

    <main class="container">
        <section class="contact-hero">
            <div class="contact-layout">
                
                <div class="contact-info-panel">
                    <h1 class="page-title">BREAK<br>THE<br><span class="strike-text">MACHINE</span></h1>
                    <div class="direct-channels">
                        <h3>DIRECT CONTACT</h3>
                        <a href="mailto:kodybousher@gmail.com" class="contact-link">kodybousher@gmail.com</a>
                        <p class="phone-stub">// SECURE LINE: +1 (519) 217-3999</p>
                    </div>

                    </div>
                </div>

                <div class="contact-form-panel">
                    <form action="#" method="POST" class="brutal-form">
                        <div class="form-group">
                            <label for="name">YOUR NAME</label>
                            <input type="text" id="name" name="name" required placeholder="Name">
                        </div>
                        <div class="form-group">
                            <label for="email">YOUR EMAIL</label>
                            <input type="email" id="email" name="email" required placeholder="Email">
                        </div>
                        <div class="form-group">
                            <label for="message">YOUR MESSAGE</label>
                            <textarea id="message" name="message" rows="6" required placeholder="Message"></textarea>
                        </div>
                        <button type="submit" class="brutal-submit-btn">
                            <span>Submit</span>
                            <span class="arrow">→</span>
                        </button>
                    </form>
                </div>

            </div>
        </section>
    </main>

    <footer class="footer-minimal">
        <p>© 2026 KODY BOUSHER</p>
    </footer>

</body>
</html>
